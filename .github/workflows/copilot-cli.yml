name: Copilot Codebase Analysis

on:
  push:
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Type of analysis to perform'
        required: false
        default: 'code-quality'
        type: choice
        options:
          - code-quality
          - security
          - documentation
          - testing

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  copilot-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install GitHub Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Analyze and Improve Codebase
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "🚀 Starting Copilot CLI analysis..."
          
          # Use Copilot CLI to analyze codebase and trigger coding agent via MCP
          copilot --allow-all-tools -p "Analyze the codebase at ${{ github.repository }} and identify the top 1 most important improvement.
          
          Then use GitHub MCP tools to:
          1. Call 'issue_write' with method='create' to create an issue in liubchigo/takahashi-presenter with:
             - title: '🚀 Automated Improvement - $(date +%Y-%m-%d)'
             - body: Description of the improvement and its impact
             - labels: ['copilot-analysis', 'enhancement']
          
          2. Call 'assign_copilot_to_issue' with:
             - owner: liubchigo
             - repo: takahashi-presenter
             - issue_number: (from step 1)
             - base_ref: ${{ github.ref_name }}
          
          Report the issue number and confirm the coding agent was assigned."
          
          echo "✅ Analysis complete, coding agent assigned to issue!"
      
      - name: Create Summary
        run: |
          echo "## 🔍 Copilot Analysis Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copilot has analyzed the codebase, created an issue, and assigned the coding agent to implement improvements." >> $GITHUB_STEP_SUMMARY
