name: Copilot Codebase Analysis

on:
  push:
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Type of analysis to perform'
        required: false
        default: 'code-quality'
        type: choice
        options:
          - code-quality
          - security
          - documentation
          - testing

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  copilot-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install GitHub Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Analyze and Improve Codebase
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "🚀 Starting Copilot CLI analysis..."
          
          # Use Copilot CLI to analyze codebase and create an issue
          ISSUE_NUMBER=$(copilot --allow-all-tools -p "Analyze the codebase at ${{ github.repository }} and identify the top 1 most important improvement.
          
          Then use GitHub MCP tools to:
          1. Call 'issue_write' with method='create' to create an issue in liubchigo/takahashi-presenter with:
             - title: '🚀 Automated Improvement - $(date +%Y-%m-%d)'
             - body: Description of the improvement and its impact
             - labels: ['copilot-analysis', 'enhancement']
          
          Report ONLY the issue number as a single integer, nothing else." | grep -oE '[0-9]+' | head -1)
          
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "✅ Analysis complete! Issue #$ISSUE_NUMBER created."
        id: analyze
      
      - name: Assign Coding Agent to Issue
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "🤖 Assigning Copilot coding agent to issue #${{ steps.analyze.outputs.ISSUE_NUMBER }}..."
          
          # Use GitHub API to assign coding agent to the issue
          # Note: If 'copilot[bot]' doesn't work, you may need to use the MCP tool or a different assignee
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.COPILOT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/liubchigo/takahashi-presenter/issues/${{ steps.analyze.outputs.ISSUE_NUMBER }}/assignees \
            -d '{"assignees":["copilot[bot]"]}'
          
          echo "✅ Coding agent assigned to issue #${{ steps.analyze.outputs.ISSUE_NUMBER }}!"
      
      - name: Create Summary
        run: |
          echo "## 🔍 Copilot Analysis Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Issue Created:** #${{ steps.analyze.outputs.ISSUE_NUMBER }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copilot has analyzed the codebase, created an issue, and assigned the coding agent to implement improvements." >> $GITHUB_STEP_SUMMARY
