name: Copilot Codebase Analysis

on:
  push:
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Type of analysis to perform'
        required: false
        default: 'code-quality'
        type: choice
        options:
          - code-quality
          - security
          - documentation
          - testing
      assign_copilot:
        description: 'Assign Copilot to work on the created issue'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write

jobs:
  copilot-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install GitHub Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Create Issue and Assign Copilot via MCP
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "🚀 Starting Copilot CLI analysis..."
          
          # Create label if it doesn't exist
          gh label create "copilot-analysis" --description "Analysis from Copilot CLI" --color "0E8A16" || true
          
          # Determine if we should assign the coding agent
          ASSIGN_AGENT="${{ github.event.inputs.assign_copilot }}"
          if [ "$ASSIGN_AGENT" != "false" ]; then
            AGENT_INSTRUCTION="After creating the issue, assign the coding agent to work on it using base branch '${{ github.ref_name }}'."
          else
            AGENT_INSTRUCTION=""
          fi
          
          # Use Copilot CLI with GitHub MCP to analyze, create issue, and optionally assign agent
          copilot --allow-all-tools -p "Analyze this codebase at ${{ github.repository }} and identify the top 1 most important improvement.
          
          Then use the GitHub MCP server tools to create a GitHub issue in ${{ github.repository }} with:
          - Title: '🔍 Top Priority Improvement - $(date +%Y-%m-%d)'
          - Body containing:
            1. Description of the current state
            2. Proposed improvement
            3. Impact assessment
          - Label: copilot-analysis
          
          $AGENT_INSTRUCTION
          
          Report back the issue number that was created."
          
          echo "✅ Issue created and processed via GitHub MCP!"
      
      - name: Create Analysis Summary
        run: |
          echo "## 🔍 Copilot Analysis Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A new issue has been created with the detailed analysis results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View issues: [${{ github.repository }}/issues](/${{ github.repository }}/issues?q=is%3Aissue+label%3Acopilot-analysis)" >> $GITHUB_STEP_SUMMARY
