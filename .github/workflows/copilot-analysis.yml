name: Copilot Codebase Analysis

on:
  push:
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Type of analysis to perform'
        required: false
        default: 'code-quality'
        type: choice
        options:
          - code-quality
          - security
          - documentation
          - testing
      assign_copilot:
        description: 'Assign Copilot to work on the created issue'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write

jobs:
  copilot-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install GitHub Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Run Copilot Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "🚀 Starting Copilot CLI analysis..."
          
          # Run copilot and save output
          copilot -p "Analyze this codebase and suggest only the top 1 most important improvement. Provide:
          1. Title
          2. Description of the current state
          3. Proposed improvement
          4. Impact assessment
          
          Only one suggestion - the highest priority improvement." > analysis.md
          
          echo "✅ Analysis complete!"
      
      - name: Create GitHub Issue with Results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create label if it doesn't exist
          gh label create "copilot-analysis" --description "Analysis from Copilot CLI" --color "0E8A16" || true
          
          # Create issue with TOP improvement only and capture the issue number
          ISSUE_URL=$(gh issue create \
            --title "🔍 Top Priority Improvement - $(date +%Y-%m-%d)" \
            --body-file analysis.md \
            --label "copilot-analysis")
          
          # Extract issue number from URL
          ISSUE_NUMBER=$(echo $ISSUE_URL | grep -oE '[0-9]+$')
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          
          echo "✅ Issue #$ISSUE_NUMBER created with top improvement!"
      
      - name: Assign Copilot to Work on Issue
        if: github.event.inputs.assign_copilot != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Assign Copilot coding agent using REST API
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}/assignees \
            --input - <<< '{
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${{ github.repository }}",
              "base_branch": "${{ github.ref_name }}",
              "custom_instructions": "",
              "custom_agent": "",
              "model": ""
            }
          }'
          
          echo "✅ Copilot coding agent assigned to issue #${{ env.ISSUE_NUMBER }}!"
      
      - name: Create Analysis Summary
        run: |
          echo "## 🔍 Copilot Analysis Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A new issue has been created with the detailed analysis results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View issues: [${{ github.repository }}/issues](/${{ github.repository }}/issues?q=is%3Aissue+label%3Acopilot-analysis)" >> $GITHUB_STEP_SUMMARY
