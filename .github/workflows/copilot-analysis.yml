name: Copilot Codebase Analysis

on:
  push:
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Type of analysis to perform'
        required: false
        default: 'code-quality'
        type: choice
        options:
          - code-quality
          - security
          - documentation
          - testing

permissions:
  contents: read
  issues: write

jobs:
  copilot-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install GitHub Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Create Issue and Assign Copilot via MCP
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          echo "🚀 Starting Copilot CLI analysis..."
          
          # Create label if it doesn't exist
          gh label create "copilot-analysis" --description "Analysis from Copilot CLI" --color "0E8A16" || true
          
          # Use Copilot CLI with GitHub MCP to analyze, create issue, and assign coding agent
          copilot --allow-all-tools -p "Analyze this codebase at ${{ github.repository }} and identify the top 1 most important improvement.
          
          Then call the GitHub MCP tool 'issue_write' with method='create' to create a GitHub issue in ${{ github.repository }} with:
          - owner: liubchigo
          - repo: takahashi-presenter
          - Title: '🔍 Top Priority Improvement - $(date +%Y-%m-%d)'
          - Body containing:
            1. Description of the current state
            2. Proposed improvement
            3. Impact assessment
          - labels: ['copilot-analysis']
          
          After creating the issue, call the GitHub MCP tool 'assign_copilot_to_issue' with these parameters:
          - owner: liubchigo
          - repo: takahashi-presenter
          - issue_number: (the issue number you just created)
          - base_ref: ${{ github.ref_name }}
          
          Report back the issue number that was created and confirm the coding agent was assigned."
          
          echo "✅ Issue created and processed via GitHub MCP!"
      
      - name: Create Analysis Summary
        run: |
          echo "## 🔍 Copilot Analysis Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A new issue has been created with the detailed analysis results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View issues: [${{ github.repository }}/issues](/${{ github.repository }}/issues?q=is%3Aissue+label%3Acopilot-analysis)" >> $GITHUB_STEP_SUMMARY
